id = "coder-multi-status-then-diff"
product = "coder"
category = "multi_step"
messages = [
  { role = "user", content = "If README.md has changes, show me that diff" },
  { role = "assistant", tool_call = { id = "c1", name = "git_read", arguments = { mode = "status" } } },
  { role = "tool", tool_call_id = "c1", content = "M README.md" },
]

[expect]
kind = "tool_call"
tool = "git_read"
args.mode = { contains = "diff" }
