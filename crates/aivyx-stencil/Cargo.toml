[package]
name = "aivyx-stencil"
description = "Grammar-constrained tool calls for local models: a JSON Schema admitting only a valid call (shared by aivyx-pa and aivyx-toolbench)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.46", default-features = false }
